<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sp-ring" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#f0f2f5"/>
      <stop offset="30%" stop-color="#c8cdd4"/>
      <stop offset="60%" stop-color="#8a9099"/>
      <stop offset="80%" stop-color="#5e6670"/>
      <stop offset="100%" stop-color="#3a3f47"/>
    </radialGradient>
    <filter id="sp-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <radialGradient id="sp-gloss" cx="62%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sp-reflect" cx="38%" cy="82%" r="40%">
      <stop offset="0%" stop-color="#666e7a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#666e7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="49" fill="url(#sp-ring)" filter="url(#sp-shadow)"/>
  <circle cx="50" cy="50" r="42" fill="#080b14"/>
  <circle cx="50" cy="50" r="42" fill="url(#sp-reflect)"/>

  <!-- Spotlight beam icon: a clapperboard / star shape representing Talent Systems -->
  <!-- "S" letter in gold for Spotlight -->
  <text x="50" y="62" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="42" fill="url(#sp-gold)">S</text>
  <!-- Small "P" subscript -->
  <text x="68" y="62" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="20" fill="#f59e0b" opacity="0.85">P</text>

  <circle cx="50" cy="50" r="42" fill="url(#sp-gloss)"/>
</svg>
